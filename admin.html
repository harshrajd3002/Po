<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Portfolio</title>

  <!-- Prevent indexing -->
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230a0a0f'/><text y='72' x='50' text-anchor='middle' font-size='44' font-family='system-ui' font-weight='700' fill='%234a7fa5'>ADM</text></svg>">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/admin.css">
</head>

<body class="admin-body">

  <!-- ======================================================
       LOGIN SCREEN
  ======================================================= -->
  <div id="adminLogin" class="admin-login">
    <div class="login-card">

      <div class="login-card__logo">H.D.</div>
      <div class="login-card__label">Admin Panel</div>

      <h1>Sign in</h1>
      <p>Enter your password to manage portfolio content.</p>

      <div class="login-error" id="loginError" role="alert">
        Incorrect password. Please try again.
      </div>

      <form id="loginForm" autocomplete="off" novalidate>
        <div class="form-group">
          <label class="form-label" for="adminPassword">Password</label>
          <input
            class="form-input"
            type="password"
            id="adminPassword"
            name="password"
            autocomplete="current-password"
            autofocus
            placeholder="Enter password"
            required>
        </div>
        <button class="btn-save" type="submit" style="width:100%;justify-content:center;padding:0.75rem;">
          Continue →
        </button>
      </form>

      <p style="margin-top:1.5rem;font-size:0.72rem;color:var(--text-muted);text-align:center;">
        Default password: <code style="color:var(--accent-light);font-size:0.72rem;">harshraj@admin</code>
      </p>

    </div>
  </div>

  <!-- ======================================================
       ADMIN LAYOUT (shown after login)
  ======================================================= -->
  <div id="adminLayout" class="admin-layout">

    <!-- Sidebar -->
    <aside class="admin-sidebar" role="navigation" aria-label="Admin sections">
      <div class="admin-sidebar__brand">
        <div class="admin-sidebar__brand-name">Harshraj Dodiya</div>
        <div class="admin-sidebar__brand-role">Portfolio Admin</div>
      </div>

      <p class="admin-nav-label">Sections</p>
      <div id="adminNav"></div>

      <div class="admin-nav-divider"></div>
      <p class="admin-nav-label">Data</p>

      <button class="admin-nav-item" id="btnExport" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Export JSON
      </button>

      <button class="admin-nav-item" id="btnImport" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        Import JSON
      </button>
      <input type="file" id="importFile" accept=".json" style="display:none">

      <div class="admin-sidebar__actions">
        <button class="admin-nav-item" id="btnReset" type="button"
                style="color:var(--text-muted);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.95"/></svg>
          Reset to Defaults
        </button>
        <button class="admin-nav-item" id="btnLogout" type="button"
                style="color:var(--text-muted);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Log Out
        </button>

        <a href="index.html"
           class="admin-nav-item"
           target="_blank"
           rel="noopener noreferrer"
           style="margin-top:0.25rem;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          View Portfolio
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="admin-main" role="main">

      <!-- Panels — one per section, rendered by admin.js -->
      <div id="panel-meta"       class="admin-panel"></div>
      <div id="panel-home"       class="admin-panel"></div>
      <div id="panel-about"      class="admin-panel"></div>
      <div id="panel-experience" class="admin-panel"></div>
      <div id="panel-education"      class="admin-panel"></div>
      <div id="panel-certifications" class="admin-panel"></div>
      <div id="panel-skills"         class="admin-panel"></div>
      <div id="panel-projects"   class="admin-panel"></div>
      <div id="panel-resume"     class="admin-panel"></div>
      <div id="panel-contact"    class="admin-panel"></div>

    </main>
  </div>

  <!-- Toast notification -->
  <div id="adminToast" class="admin-toast" role="status" aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    <span class="toast-msg"></span>
  </div>

  <!-- Scripts -->
  <!-- Firebase SDK (compat mode — works with global variables) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <!-- Firebase project config (fill in js/firebase-config.js) -->
  <script src="js/firebase-config.js"></script>
  <!-- Portfolio data layer + admin panel -->
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>

</body>
</html>
